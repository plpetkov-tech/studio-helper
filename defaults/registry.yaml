  # IDEA Comm vinyl poster option: outer size 4020 x 3050 mm.
  # Includes an 80 mm image pocket/hem; keep text and logos at least 200 mm from every edge.
  - id: mall-print-idea-vinyl-4020x3050
    name: IDEA Comm vinyl poster (4020 x 3050 mm, 80 mm pocket)
    group: Mall print
    notes: "80 mm pocket in the image. Text and logos at least 20 cm from every edge."
    kind: print
    size: {w: 4020, h: 3050, unit: mm}
    safe_mm: 200
    scale: 0.1
    exports: [tiff]

  # IDEA Comm vinyl poster option: finished size 4000 x 3000 mm with a 70 mm pocket.
  # Minimum safe area is 200 mm on every edge; 250 mm is recommended at the top.
  - id: mall-print-idea-vinyl-4000x3000
    name: IDEA Comm vinyl poster (4000 x 3000 mm, 70 mm pocket)
    group: Mall print
    notes: "70 mm pocket with a seam. Text at least 20 cm from every edge; 25 cm from the top recommended."
    kind: print
    size: {w: 4000, h: 3000, unit: mm}
    safe_mm: 200
    scale: 0.1
    exports: [tiff]

  # IDEA Comm vinyl poster option: outer size 4100 x 3100 mm.
  # Front pocket is 100 mm; rear pocket is 70 mm and begins 100 mm from the outer edge.
  # Minimum safe area is 200 mm on every edge; 250 mm is recommended at the top.
  - id: mall-print-idea-vinyl-4100x3100
    name: IDEA Comm vinyl poster (4100 x 3100 mm, 100/70 mm pockets)
    group: Mall print
    notes: "Front pocket 10 cm. Back pocket 7 cm, starting 10 cm from the edge. Text at least 20 cm from every edge; 25 cm from the top recommended."
    kind: print
    size: {w: 4100, h: 3100, unit: mm}
    safe_mm: 200
    scale: 0.1
    exports: [tiff]

  # IDEA Comm 9 m² scroller: artwork must keep text/images 100 mm from the edge.
  # Supplier requests CMYK TIFF/EPS, minimum 300 dpi, at 1:10 scale. EPS is not a supported registry export.
  - id: mall-print-idea-scroller-3410x2430
    name: IDEA Comm 9 m² scroller (3410 x 2430 mm, artwork at 1:10)
    group: Mall print
    notes: "Backlit paper (Fibermark 120 g, Becklit/Pretex). No text or images within 10 cm of the edge. CMYK TIFF, at least 300 dpi on the 1:10 file (EPS also accepted)."
    kind: print
    size: {w: 3410, h: 2430, unit: mm}
    safe_mm: 100
    scale: 0.1
    tiff_ppi: 30         # = the supplier's 300 dpi on the 1:10 file
    exports: [tiff]

