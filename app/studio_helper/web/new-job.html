<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New job · Studio Helper</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="jobs">
  <main>
    <a class="crumb" href="/index.html">‹ Jobs</a>
    <div class="head">
      <div><h1>New job</h1><p>Name it, pick what you’re making, and change the bleed if the print shop asked for something different.</p></div>
    </div>
    <div id="error-banner" class="banner error page-banner" hidden></div>
    <div class="nj">
      <div class="stack">
        <div class="field">
          <label for="nj-name">Job name</label>
          <input class="input" id="nj-name" placeholder="e.g. Paradise Center — spring" autocomplete="off">
          <span class="note">Folder: <span class="mono" id="folder-preview">Studio Jobs\…</span></span>
        </div>
        <div class="field">
          <span class="lbl">Start from</span>
          <div class="presets" id="presets"></div>
        </div>
        <div class="card picker">
          <div class="picker-head">
            <input class="search" id="fmt-search" type="search" placeholder="Search formats: mall, citylight, story…" aria-label="Search formats">
            <span class="note" id="fmt-count"></span>
          </div>
          <div id="groups"><p class="empty">Loading formats…</p></div>
          <div class="custom-row" id="custom-list"></div>
          <div id="custom-slot"></div>
        </div>
      </div>
      <aside class="card summary" aria-live="polite" id="summary"></aside>
    </div>
  </main>
  <script src="/static/api.js"></script>
  <script src="/static/shell.js"></script>
  <script src="/static/new-job.js"></script>
</body>
</html>
