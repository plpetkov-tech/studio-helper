<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs · Studio Helper</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="jobs">
  <main>
    <div class="head">
      <div><h1>Jobs</h1><p>Everything you’re delivering, and how far along it is.</p></div>
      <a class="btn primary lg" href="/new-job.html">+ New job</a>
    </div>
    <div id="error-banner" class="banner error page-banner" hidden></div>
    <div class="toolbar">
      <input class="search" id="job-search" type="search" placeholder="Search jobs" aria-label="Search jobs">
      <div class="seg" role="group" aria-label="Show">
        <button data-filter="active" aria-pressed="true">In progress</button>
        <button data-filter="done" aria-pressed="false">Delivered</button>
        <button data-filter="all" aria-pressed="false">All</button>
      </div>
    </div>
    <div class="jobs" id="jobs-list"><p class="empty">Loading…</p></div>
  </main>
  <script src="/static/api.js"></script>
  <script src="/static/shell.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
