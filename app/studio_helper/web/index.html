<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Helper</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html"><span class="brand-mark"></span><h1>Studio Helper</h1></a>
    <nav>
      <a href="/index.html" class="current">Home</a>
      <a href="/registry.html">Registry</a>
      <a href="/setup-check.html">Setup check</a>
      <a href="#" id="quit-link">Quit</a>
    </nav>
  </header>

  <main>
    <div id="error-banner" class="banner error" hidden></div>

    <div class="actions">
      <a class="button primary" href="/new-job.html">New job</a>
    </div>

    <h2>Recent jobs</h2>
    <div id="jobs-list">
      <p class="empty-state">Loading…</p>
    </div>

    <h2>Updates</h2>
    <div class="card">
      <div id="update-idle">
        <p>Current version: <strong id="current-version">&hellip;</strong></p>
        <div class="actions">
          <button id="check-update-btn">Check for updates</button>
        </div>
      </div>
      <div id="update-available" hidden>
        <p><span class="badge warn">Update</span> Version <strong id="latest-version"></strong> is available.</p>
        <div id="update-notes" class="preview" hidden></div>
        <div class="actions">
          <button id="install-update-btn" class="primary">Download &amp; install</button>
        </div>
      </div>
      <p id="update-status" class="hint" hidden></p>
    </div>
  </main>

  <script src="/static/api.js"></script>
  <script src="/static/home.js"></script>
  <script src="/static/updates.js"></script>
</body>
</html>
