name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.in
      - name: Lint (ruff)
        run: ruff check app tests packaging
      - name: Test
        run: pytest -q -m "not adobe"

  supply-chain:
    name: pip-audit + license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.in
      - name: pip-audit
        run: pip-audit -r requirements.in
      - name: License allowlist check
        run: python packaging/check_licenses.py requirements.in

  jsx-lint:
    name: ExtendScript lint (ES3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: ESLint over adobe/**/*.jsx and tests/adobe/**/*.jsx (ecmaVersion 3)
        run: npx --yes eslint@9 -c adobe/eslint.config.js 'adobe/**/*.jsx' 'tests/adobe/**/*.jsx'
      - name: Execute new_print_doc.jsx's pure geometry/grouping logic
        run: node tests/adobe/check_jsx_logic.js
      - name: Execute preflight_export.jsx's pure interval-gap/naming logic
        run: node tests/adobe/check_preflight_logic.js

  figma-plugin:
    name: Figma plugin build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build and test
        working-directory: figma-plugin
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "No figma-plugin/package.json yet (pre-M5) -- skipping."
          fi
